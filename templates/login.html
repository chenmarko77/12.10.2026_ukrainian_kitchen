{% extends "base.html" %}

{% block title %}Login | Food Shop{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <section class="col-12 col-md-7 col-lg-5" aria-labelledby="login-heading">
            <h1 id="login-heading">Login</h1>
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form action="{{ url_for('login') }}" method="post" class="card card-body shadow-sm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" minlength="3" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" minlength="8" maxlength="128" required>
                </div>
                <button class="btn btn-success" type="submit">Login</button>
            </form>
            <p class="mt-3">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
        </section>
    </div>
{% endblock %}
