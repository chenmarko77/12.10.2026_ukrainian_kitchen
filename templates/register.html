{% extends "base.html" %}

{% block title %}Register | Food Shop{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <section class="col-12 col-md-7 col-lg-5" aria-labelledby="register-heading">
            <h1 id="register-heading">Create an account</h1>
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form action="{{ url_for('register') }}" method="post" class="card card-body shadow-sm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" minlength="3" maxlength="100" aria-describedby="username-help" required>
                    <div class="form-text" id="username-help">Use 3 to 100 characters. Usernames are case-sensitive.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-help" required>
                    <div class="form-text" id="password-help">Use 8 to 128 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">Confirm password</label>
                    <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="128" required>
                </div>
                <button class="btn btn-success" type="submit">Register</button>
            </form>
            <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </section>
    </div>
{% endblock %}
